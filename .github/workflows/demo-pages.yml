name: Demo naar GitHub Pages

# De echte site draait op Cloudflare Pages (turkserangers.com). Dit is de
# reservevariant: een voorbeeldversie op https://<gebruiker>.github.io/<repo>/,
# handig om iets te laten zien zonder aan het clubdomein te komen.
#
# Draait alleen wanneer iemand er zelf om vraagt: tabblad Actions → deze
# workflow → "Run workflow". Zet vooraf Settings → Pages → Source op
# "GitHub Actions".

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Statische export bouwen
        env:
          # Een projectsite staat onder /<repo>/; zonder deze prefix wijzen
          # alle links en afbeeldingen naar de verkeerde map.
          BASE_PATH: /${{ github.event.repository.name }}
          # Voorbeelddata hoort niet in Google, naast de echte clubsite.
          DEMO_NOINDEX: "1"
        run: npm run build:static

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
